name: Release everycli
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Validate version and target
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(cargo +1.97.1 metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')" = "${RELEASE_TAG#v}"
          rustc +1.97.1 -vV | grep -Fx "host: $EXPECTED_TARGET"
      - name: Lint, test, and build
        env:
          EVERYCLI_RELEASE_BUILD: '1'
        run: |
          cargo +1.97.1 fmt --check
          cargo +1.97.1 clippy --release --all-targets --locked -- -D warnings
          cargo +1.97.1 test --release --locked
          cargo +1.97.1 build --release --locked --bin everycli
          target/release/everycli --version --json
          target/release/everycli --help
      - name: Browser regressions
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          EVERYCLI_BIN: target/release/everycli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Package binary and notices
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp target/release/everycli "dist/everycli-$TARGET"
          cd dist
          shasum -a 256 "everycli-$TARGET" > "everycli-$TARGET.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: everycli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  containers:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Verify clean worker and supervisor builds (no publication)
        env:
          RUST_IMAGE: rust@sha256:7f7a53a25a0319dd8284e279d529d45759cb384d59b14cc6806132910f45522e
          RUNTIME_IMAGE: debian@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
        run: |
          set -euo pipefail
          docker build --target updater --build-arg RUST_IMAGE="$RUST_IMAGE" --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" -t everyframe-updater:check .
          docker build --target worker --build-arg RUST_IMAGE="$RUST_IMAGE" --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" -t everyframe-worker:check .
          test "$(docker image inspect everyframe-worker:check --format '{{index .Config.Entrypoint 0}}')" = /usr/local/bin/everyframe-worker
          test "$(docker image inspect everyframe-updater:check --format '{{index .Config.Entrypoint 0}}')" = /usr/local/bin/everyframe-updater
          # Empty, isolated supervisor must stay idle without contacting services.
          docker run -d --name updater-smoke --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /state:mode=0700 --tmpfs /tmp everyframe-updater:check
          trap 'docker rm -f updater-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 10); do
            docker logs updater-smoke 2>&1 | grep -q '"state":"not_enrolled"' && break
            sleep 1
          done
          test "$(docker inspect updater-smoke --format '{{.State.Running}}')" = true
          docker logs updater-smoke 2>&1 | grep -q '"state":"not_enrolled"'
  publish:
    needs: [build, containers]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Configure required reviewers on this environment for publication approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: everycli-*
          path: dist
          merge-multiple: true
      - name: Prepare version-pinned installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sed "s/@VERSION@/$RELEASE_TAG/g" scripts/everycli-installer.sh > dist/everycli-installer.sh
          sh -n dist/everycli-installer.sh
          cp LICENSE LICENSE-NOTICE.md dist/
          cd dist
          sha256sum --check everycli-*.sha256
      - name: Checksum installer
        run: |
          set -euo pipefail
          cd dist
          sha256sum everycli-installer.sh > everycli-installer.sh.sha256
      - name: Create release draft, upload, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Never silently overwrite an existing release or move its tag.
          if [ -f "RELEASE-NOTES-$RELEASE_TAG.md" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "everycli $RELEASE_TAG" --notes-file "RELEASE-NOTES-$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "everycli $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*
          # Only the highest published version becomes "latest" (the updater and
          # installer URL follow it); a hotfix tag on an older line must not.
          # A failed listing aborts here instead of defaulting to "latest".
          tags=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
          highest=$(printf '%s\n' "$tags" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$RELEASE_TAG" | sort -V | tail -n 1)" = "$RELEASE_TAG" ]; then
            latest=true
          else
            latest=false
          fi
          echo "Highest published release: ${highest:-none}; marking $RELEASE_TAG latest=$latest"
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
